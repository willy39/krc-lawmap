# 규범 보정 (설계서 6.1)
# "<normId>": { shortTitle, primaryField, isCore, parentId }
items: {}

# 큐레이션 법령 목록 (L1r) — 이름은 law.go.kr 정식 법령명과 일치해야 한다.
core_laws:
  - { name: 대한민국헌법, level: L0_CONSTITUTION, field: ORG }
  - { name: 대한적십자사 조직법, level: L1_ACT, field: ORG }
  - { name: 대한적십자사 조직법 시행령, level: L2_DECREE, field: ORG, parent: 대한적십자사 조직법 }
curated_laws:
  - { name: 혈액관리법, field: BLD, isCore: true }
  - { name: 혈액관리법 시행령, field: BLD, parent: 혈액관리법 }
  - { name: 혈액관리법 시행규칙, field: BLD, parent: 혈액관리법 }
  - { name: 재해구호법, field: DIS, isCore: true }
  - { name: 공공기관의 운영에 관한 법률, field: ORG, isCore: true }
  # 국제인도법 이행·관련 법률 (2026-10-16 추가 — 본문에 국제인도법·제네바협약·무력충돌 규정)
  - { name: 국제형사재판소 관할 범죄의 처벌 등에 관한 법률, field: INT, isCore: true }
  - { name: 군인의 지위 및 복무에 관한 기본법, field: INT }
  - { name: 국제형사사법 공조법, field: INT }
  - { name: 화학무기ㆍ생물무기의 금지와 특정화학물질ㆍ생물작용제 등의 제조ㆍ수출입 규제 등에 관한 법률, field: INT }

# 행정규칙 검색어 (admrul, 본문 검색) — 본문에만 기관명이 스치는 고시가 많아 제목 키워드로 한 번 더 거른다
admrul_queries: [대한적십자사, 혈액원, 국제인도법, 제네바협약, 전쟁법, 무력충돌]
admrul_title_filter: "적십자|혈액|헌혈|수혈|채혈|혈장|이산가족|인도법|사할린|재해위문|재난피해자|구호|전쟁법|해외파병|국가유산보호"
# 행정규칙 상위 법령: 제목 키워드 → 큐레이션 법령 (위에서부터 첫 일치)
admrul_parent_rules:
  - { pattern: "혈액|헌혈|수혈|채혈|혈장", parent: 혈액관리법 }
  - { pattern: "재해|재난|구호", parent: 재해구호법 }
  - { pattern: "국제인도법 한국위원회|적십자", parent: 대한적십자사 조직법 }
  - { pattern: "전쟁법|해외파병|국가유산보호|인도법", parent: 군인의 지위 및 복무에 관한 기본법 }

# 조약 (trty) — 제네바협약 계열 + 국제인도법(IHL) 조약. 조약명 검색으로 모은 뒤 include 에 맞고 exclude 에 걸리지 않는 것만 수집
#   2026-10-16 점검: 제3추가의정서(식별표장, 2005)·1954 무력충돌 시 문화재 보호 협약은 law.go.kr 미등재 — 수집 대상 없음
treaties:
  queries: [제네바, 국제적십자위원회, 병원선, 헤이그, 질식성, 세균무기, 화학무기, 특정재래식무기, 파편, 지뢰, 전쟁잔류폭발물, 로마규정, 무력충돌, 무기거래조약]
  include: "1949년 8월 12일자 제네바협약|1864년 8월 22일자 제네바협약|국제적십자위원회|전시 병원선|육전의 법 및 관습|질식성, 독성|세균무기|화학무기의 개발|특정재래식무기|탐지 불능한 파편|지뢰,부비트랩|전쟁잔류폭발물|국제형사재판소에 관한 로마규정|아동의 무력충돌 참여|무기거래조약"
  exclude: "정정|부속서"
  core: "1949년 8월 12일자 제네바협약 \\(제[1-4]협약\\)|\\((제1|제2)의정서\\)$|국제적십자위원회"
  # 개정·의정서·유보·선언 문서를 본 조약 아래에 둔다 (child 정규식 → parent 정규식, 위에서부터 첫 일치)
  parents:
    - { child: "추가 및 국제적 무력충돌의 희생자 보호에 관한 의정서.+(유보|선언|개정)", parent: "추가 및 국제적 무력충돌의 희생자 보호에 관한 의정서 \\(제1의정서\\)$" }
    - { child: "특정재래식무기의 사용금지 및 제한에 관한 협약 *(제1의정서|개정제2의정서|제1조 개정)|전쟁잔류폭발물", parent: "^과도한 상해 또는 무차별적 효과를 초래할 수 있는 특정재래식무기의 사용금지 및 제한에 관한 협약$" }
    - { child: "로마규정 .*개정", parent: "^국제형사재판소에 관한 로마규정$" }
    - { child: "질식성.+(유보|철회)", parent: "^질식성, 독성 또는 그 밖의 가스 및 세균학적 전쟁 수단의 전시 사용금지에 관한 의정서$" }

# 판례·해석 후보 검색어 (본문 검색). ※ 여러 단어 검색어는 구(phrase)가 아니라 단어 AND 로 동작해 잡음이 많다
#   (실측: '국제형사재판소 관할 범죄' → 탄핵·선거 사건, '포로의 대우' → 국군포로·보훈 사건) → 국제인도법은 단일어만 사용
case_queries: [대한적십자사, 적십자사, 적십자병원, 혈액원, 대한적십자사 조직법, 국제인도법]

# 공공기관 정관·규정 (target=pi, 소관부처명으로 필터) — P0 실측 확인
pi_agency: 대한적십자사
pi_target: pi

# 중앙부처 1차 해석 target (P0 실측: {부처약어}CgmExpc 형식 동작 확인)
cgm_targets:
  - { ministry: 보건복지부, target: mohwCgmExpc }
  - { ministry: 행정안전부, target: moisCgmExpc }
  - { ministry: 고용노동부, target: moelCgmExpc }

# 자치법규 묶음별 검색어·기본 부모 (설계서 3.2)
ordinance_bundles:
  redcross: { queries: [적십자], parent: 대한적십자사 조직법, requireBody: false }
  blood:    { queries: [헌혈], parent: 혈액관리법, requireBody: false }
  disaster: { queries: [재해구호, 이재민], parent: 재해구호법, requireBody: true }
  family:   { queries: [이산가족], parent: null, requireBody: true }
